<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="410" viewBox="0 0 680 410" role="img"><title>Larmor precession of angular momentum about a magnetic field</title><desc>The angular momentum vector L is tilted from the vertical field B and its tip traces a circle around B, sweeping out a cone. The magnetic moment points opposite to L.</desc><style>
:root{--p:#1f1e1d;--s:#5f5e5a;--t:#888780;--b:#d3d1c7}
text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.t{font-size:14px;font-weight:400;fill:var(--p)}.th{font-size:14px;font-weight:500;fill:var(--p)}.ts{font-size:12px;font-weight:400;fill:var(--s)}
.leader{stroke:var(--t);stroke-width:.5;stroke-dasharray:3 3;fill:none}
.c-gray{--f:#F1EFE8;--k:#5F5E5A;--h:#444441;--u:#5F5E5A}.c-teal{--f:#E1F5EE;--k:#0F6E56;--h:#085041;--u:#0F6E56}.c-coral{--f:#FAECE7;--k:#993C1D;--h:#712B13;--u:#993C1D}
g[class*="c-"]>rect,g[class*="c-"]>circle,g[class*="c-"]>ellipse,rect[class*="c-"],circle[class*="c-"],ellipse[class*="c-"]{fill:var(--f);stroke:var(--k)}
g[class*="c-"]>.th,g[class*="c-"]>.t{fill:var(--h)}g[class*="c-"]>.ts{fill:var(--u)}
</style><rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line x1="310" y1="284" x2="310" y2="46" stroke="var(--t)" stroke-width="1" marker-end="url(#arrow)"/>
<text class="th" x="322" y="56">B</text>
<ellipse cx="310" cy="110" rx="80" ry="18" fill="none" stroke="var(--t)" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="307" y1="283" x2="230" y2="110" stroke="var(--t)" stroke-width="0.5" stroke-dasharray="3 3"/>
<path d="M 265 125 A 80 18 0 0 0 355 125" fill="none" stroke="#7F77DD" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="313" y1="283" x2="388" y2="114" stroke="#7F77DD" stroke-width="2.5" marker-end="url(#arrow)"/>
<text class="th" x="402" y="108">L, angular momentum</text>
<line x1="307" y1="297" x2="272" y2="376" stroke="#D85A30" stroke-width="2.5" marker-end="url(#arrow)"/>
<text class="th" x="288" y="384">μ, magnetic moment</text>
<circle cx="310" cy="290" r="5" fill="var(--t)"/>
<text class="ts" x="216" y="134" text-anchor="end">Tip of L circles B</text>
<text class="ts" x="216" y="152" text-anchor="end">at ω_L = eB/2m</text>
<text class="ts" x="402" y="128">fixed length, fixed tilt</text>
<text class="ts" x="288" y="402">opposite to L (negative charge)</text>
</svg>
