<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Larmor precession of angular momentum about B</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Larmor precession of angular momentum about B</h1>
<svg width="100%" viewBox="0 0 680 410" role="img"><title>Larmor precession of angular momentum about a magnetic field</title><desc>The angular momentum vector L is tilted from the vertical field B and its tip traces a circle around B, sweeping out a cone. The magnetic moment points opposite to L.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line x1="310" y1="284" x2="310" y2="46" stroke="var(--t)" stroke-width="1" marker-end="url(#arrow)"/>
<text class="th" x="322" y="56">B</text>
<ellipse cx="310" cy="110" rx="80" ry="18" fill="none" stroke="var(--t)" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="307" y1="283" x2="230" y2="110" stroke="var(--t)" stroke-width="0.5" stroke-dasharray="3 3"/>
<path d="M 265 125 A 80 18 0 0 0 355 125" fill="none" stroke="#7F77DD" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="313" y1="283" x2="388" y2="114" stroke="#7F77DD" stroke-width="2.5" marker-end="url(#arrow)"/>
<text class="th" x="402" y="108">L, angular momentum</text>
<line x1="307" y1="297" x2="272" y2="376" stroke="#D85A30" stroke-width="2.5" marker-end="url(#arrow)"/>
<text class="th" x="288" y="384">μ, magnetic moment</text>
<circle cx="310" cy="290" r="5" fill="var(--t)"/>
<text class="ts" x="216" y="134" text-anchor="end">Tip of L circles B</text>
<text class="ts" x="216" y="152" text-anchor="end">at ω_L = eB/2m</text>
<text class="ts" x="402" y="128">fixed length, fixed tilt</text>
<text class="ts" x="288" y="402">opposite to L (negative charge)</text>
</svg>
<p class="note">Recreated from the chat "Zeeman effect and electron precession". Speeds and sizes in animations are scaled for visibility.</p>
</body>
</html>
