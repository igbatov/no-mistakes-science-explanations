<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The three normal modes of a bound electron in a magnetic field</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>The three normal modes of a bound electron in a magnetic field</h1>
<svg width="100%" viewBox="0 0 680 330" role="img"><title>The three normal modes of a bound electron in a magnetic field</title><desc>Left: linear oscillation along B at the unchanged frequency. Middle: counterclockwise circular motion about B, where the magnetic force points inward and the frequency rises by the Larmor frequency. Right: clockwise circular motion, where the magnetic force points outward and the frequency falls by the Larmor frequency.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line x1="130" y1="215" x2="130" y2="160" stroke="var(--t)" stroke-width="1"/>
<line x1="130" y1="140" x2="130" y2="85" stroke="var(--t)" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="142" y="94">B</text>
<line x1="106" y1="118" x2="106" y2="182" stroke="#888780" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<circle class="c-gray" cx="130" cy="150" r="7" stroke-width="0.5"/>
<circle cx="340" cy="150" r="60" fill="none" stroke="var(--t)" stroke-width="0.5" stroke-dasharray="3 3"/>
<circle cx="340" cy="150" r="6" fill="none" stroke="var(--t)" stroke-width="1"/>
<circle cx="340" cy="150" r="1.5" fill="var(--t)"/>
<text class="ts" x="340" y="176" text-anchor="middle">B</text>
<path d="M 392 120 A 60 60 0 0 0 370 98" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="392" y1="150" x2="358" y2="150" stroke="#1D9E75" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="375" y="140" text-anchor="middle">F</text>
<circle class="c-teal" cx="400" cy="150" r="7" stroke-width="0.5"/>
<circle cx="550" cy="150" r="60" fill="none" stroke="var(--t)" stroke-width="0.5" stroke-dasharray="3 3"/>
<circle cx="550" cy="150" r="6" fill="none" stroke="var(--t)" stroke-width="1"/>
<circle cx="550" cy="150" r="1.5" fill="var(--t)"/>
<text class="ts" x="550" y="176" text-anchor="middle">B</text>
<path d="M 602 180 A 60 60 0 0 1 580 202" fill="none" stroke="#D85A30" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="618" y1="150" x2="650" y2="150" stroke="#D85A30" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="634" y="140" text-anchor="middle">F</text>
<circle class="c-coral" cx="610" cy="150" r="7" stroke-width="0.5"/>
<text class="th" x="130" y="254" text-anchor="middle">Along B</text>
<text class="ts" x="130" y="274" text-anchor="middle">ω₀, unchanged</text>
<text class="th" x="340" y="254" text-anchor="middle">Counterclockwise</text>
<text class="ts" x="340" y="274" text-anchor="middle">ω₀ + ω_L, faster</text>
<text class="th" x="550" y="254" text-anchor="middle">Clockwise</text>
<text class="ts" x="550" y="274" text-anchor="middle">ω₀ − ω_L, slower</text>
<text class="ts" x="340" y="308" text-anchor="middle">In the two circles B points out of the page. F is the magnetic force on the electron.</text>
</svg>
<p class="note">Recreated from the chat "Zeeman effect and electron precession". Speeds and sizes in animations are scaled for visibility.</p>
</body>
</html>
