<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="416" viewBox="0 0 680 416" role="img"><title>Zeeman spectral lines and their polarization for two viewing directions</title><desc>With no field there is one line at the original frequency. Viewed along the field there are two lines, shifted down and up by the Larmor frequency, with clockwise and counterclockwise circular polarization. Viewed across the field there are three lines: the outer two linearly polarized perpendicular to B and the central one parallel to B.</desc><style>
:root{--p:#1f1e1d;--s:#5f5e5a;--t:#888780;--b:#d3d1c7}
text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.t{font-size:14px;font-weight:400;fill:var(--p)}.th{font-size:14px;font-weight:500;fill:var(--p)}.ts{font-size:12px;font-weight:400;fill:var(--s)}
.leader{stroke:var(--t);stroke-width:.5;stroke-dasharray:3 3;fill:none}
.c-gray{--f:#F1EFE8;--k:#5F5E5A;--h:#444441;--u:#5F5E5A}.c-teal{--f:#E1F5EE;--k:#0F6E56;--h:#085041;--u:#0F6E56}.c-coral{--f:#FAECE7;--k:#993C1D;--h:#712B13;--u:#993C1D}
g[class*="c-"]>rect,g[class*="c-"]>circle,g[class*="c-"]>ellipse,rect[class*="c-"],circle[class*="c-"],ellipse[class*="c-"]{fill:var(--f);stroke:var(--k)}
g[class*="c-"]>.th,g[class*="c-"]>.t{fill:var(--h)}g[class*="c-"]>.ts{fill:var(--u)}
</style><rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line class="leader" x1="340" y1="30" x2="340" y2="372"/>
<line class="leader" x1="440" y1="30" x2="440" y2="372"/>
<line class="leader" x1="540" y1="30" x2="540" y2="372"/>
<text class="th" x="40" y="58">No field</text>
<text class="ts" x="40" y="78">One line at ω₀</text>
<line x1="440" y1="40" x2="440" y2="84" stroke="#888780" stroke-width="4"/>
<line x1="40" y1="130" x2="640" y2="130" stroke="var(--b)" stroke-width="0.5"/>
<text class="th" x="40" y="168">Viewed along B</text>
<text class="ts" x="40" y="188">Two lines, circular</text>
<line x1="340" y1="150" x2="340" y2="194" stroke="#D85A30" stroke-width="4"/>
<line x1="540" y1="150" x2="540" y2="194" stroke="#1D9E75" stroke-width="4"/>
<path d="M 329 216 A 11 11 0 1 1 340 227" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 551 216 A 11 11 0 1 0 540 227" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="250" text-anchor="middle">clockwise</text>
<text class="ts" x="540" y="250" text-anchor="middle">counterclockwise</text>
<circle cx="616" cy="172" r="6" fill="none" stroke="var(--t)" stroke-width="1"/>
<circle cx="616" cy="172" r="1.5" fill="var(--t)"/>
<text class="ts" x="628" y="176">B</text>
<line x1="40" y1="264" x2="640" y2="264" stroke="var(--b)" stroke-width="0.5"/>
<text class="th" x="40" y="298">Viewed across B</text>
<text class="ts" x="40" y="318">Three lines, linear</text>
<line x1="340" y1="278" x2="340" y2="322" stroke="#D85A30" stroke-width="4"/>
<line x1="440" y1="278" x2="440" y2="322" stroke="#888780" stroke-width="4"/>
<line x1="540" y1="278" x2="540" y2="322" stroke="#1D9E75" stroke-width="4"/>
<line x1="326" y1="340" x2="354" y2="340" stroke="#D85A30" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="452" y1="330" x2="452" y2="352" stroke="#888780" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="526" y1="340" x2="554" y2="340" stroke="#1D9E75" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="364" text-anchor="middle">across B</text>
<text class="ts" x="474" y="364" text-anchor="middle">along B</text>
<text class="ts" x="540" y="364" text-anchor="middle">across B</text>
<line x1="616" y1="318" x2="616" y2="284" stroke="var(--t)" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="628" y="296">B</text>
<line x1="260" y1="378" x2="620" y2="378" stroke="var(--t)" stroke-width="0.5"/>
<text class="ts" x="340" y="398" text-anchor="middle">ω₀ − ω_L</text>
<text class="ts" x="440" y="398" text-anchor="middle">ω₀</text>
<text class="ts" x="540" y="398" text-anchor="middle">ω₀ + ω_L</text>
</svg>
