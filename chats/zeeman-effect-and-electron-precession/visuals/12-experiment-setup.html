<h1>Zeeman experiment setup and ring pattern</h1>
<svg width="100%" viewBox="0 0 680 540" role="img"><title>Zeeman effect experiment setup and what the camera sees</title><desc>A lamp sits between the north and south poles of an electromagnet. Its light travels sideways through a lens, a colour filter, a polarizer, a Fabry-Perot etalon and a second lens to a camera. Below, the camera view: single rings with the field off, and each ring split into three with the field on.</desc>
