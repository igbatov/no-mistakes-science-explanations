<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" role="img"><title>Zeeman effect experiment setup and what the camera sees</title><desc>A lamp sits between the north and south poles of an electromagnet. Its light travels sideways through a lens, a colour filter, a polarizer, a Fabry-Perot etalon and a second lens to a camera. Below, the camera view: single rings with the field off, and each ring split into three with the field on.</desc><style>
:root{--p:#1f1e1d;--s:#5f5e5a;--t:#888780;--b:#d3d1c7}
text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.t{font-size:14px;font-weight:400;fill:var(--p)}.th{font-size:14px;font-weight:500;fill:var(--p)}.ts{font-size:12px;font-weight:400;fill:var(--s)}
.leader{stroke:var(--t);stroke-width:.5;stroke-dasharray:3 3;fill:none}
.c-gray{--f:#F1EFE8;--k:#5F5E5A;--h:#444441;--u:#5F5E5A}.c-teal{--f:#E1F5EE;--k:#0F6E56;--h:#085041;--u:#0F6E56}.c-coral{--f:#FAECE7;--k:#993C1D;--h:#712B13;--u:#993C1D}
g[class*="c-"]>rect,g[class*="c-"]>circle,g[class*="c-"]>ellipse,rect[class*="c-"],circle[class*="c-"],ellipse[class*="c-"]{fill:var(--f);stroke:var(--k)}
g[class*="c-"]>.th,g[class*="c-"]>.t{fill:var(--h)}g[class*="c-"]>.ts{fill:var(--u)}
</style><rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="60" y="60" width="60" height="70" rx="4" stroke-width="0.5"/><text class="th" x="90" y="95" text-anchor="middle" dominant-baseline="central">N</text></g>
<g class="c-gray"><rect x="60" y="210" width="60" height="70" rx="4" stroke-width="0.5"/><text class="th" x="90" y="245" text-anchor="middle" dominant-baseline="central">S</text></g>
<line x1="40" y1="136" x2="40" y2="204" stroke="var(--t)" stroke-width="1" marker-end="url(#arrow)"/>
<text class="th" x="20" y="174">B</text>
<circle cx="90" cy="170" r="12" fill="#D85A30" fill-opacity="0.5" stroke="#D85A30" stroke-width="1"/>
<line x1="104" y1="170" x2="202" y2="170" stroke="#D85A30" stroke-width="2"/>
<ellipse cx="210" cy="170" rx="6" ry="34" fill="none" stroke="var(--p)" stroke-width="1"/>
<line x1="218" y1="170" x2="284" y2="170" stroke="#D85A30" stroke-width="2"/>
<rect x="286" y="140" width="8" height="60" fill="#D85A30" fill-opacity="0.3" stroke="var(--p)" stroke-width="1"/>
<line x1="296" y1="170" x2="364" y2="170" stroke="#D85A30" stroke-width="2"/>
<rect x="366" y="140" width="8" height="60" fill="none" stroke="var(--p)" stroke-width="1" stroke-dasharray="3 2"/>
<line x1="376" y1="170" x2="442" y2="170" stroke="#D85A30" stroke-width="2"/>
<rect x="444" y="136" width="5" height="68" fill="none" stroke="var(--p)" stroke-width="1"/>
<rect x="455" y="136" width="5" height="68" fill="none" stroke="var(--p)" stroke-width="1"/>
<line x1="462" y1="170" x2="522" y2="170" stroke="#D85A30" stroke-width="2"/>
<ellipse cx="530" cy="170" rx="6" ry="34" fill="none" stroke="var(--p)" stroke-width="1"/>
<line x1="538" y1="170" x2="586" y2="170" stroke="#D85A30" stroke-width="2" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="590" y="140" width="50" height="60" rx="4" stroke-width="0.5"/></g>
<text class="ts" x="90" y="304" text-anchor="middle">Lamp in magnet</text>
<text class="ts" x="210" y="232" text-anchor="middle">Lens</text>
<text class="ts" x="290" y="232" text-anchor="middle">Filter</text>
<text class="ts" x="370" y="232" text-anchor="middle">Polarizer</text>
<text class="ts" x="452" y="232" text-anchor="middle">Etalon</text>
<text class="ts" x="530" y="232" text-anchor="middle">Lens</text>
<text class="ts" x="615" y="232" text-anchor="middle">Camera</text>
<line x1="40" y1="326" x2="640" y2="326" stroke="var(--b)" stroke-width="0.5"/>
<text class="th" x="200" y="354" text-anchor="middle">Camera view, field off</text>
<circle cx="200" cy="444" r="22" fill="none" stroke="#D85A30" stroke-width="3"/>
<circle cx="200" cy="444" r="44" fill="none" stroke="#D85A30" stroke-width="3"/>
<circle cx="200" cy="444" r="66" fill="none" stroke="#D85A30" stroke-width="3"/>
<text class="th" x="480" y="354" text-anchor="middle">Camera view, field on</text>
<circle cx="480" cy="444" r="17" fill="none" stroke="#D85A30" stroke-width="1.5"/>
<circle cx="480" cy="444" r="22" fill="none" stroke="#D85A30" stroke-width="1.5"/>
<circle cx="480" cy="444" r="27" fill="none" stroke="#D85A30" stroke-width="1.5"/>
<circle cx="480" cy="444" r="39" fill="none" stroke="#D85A30" stroke-width="1.5"/>
<circle cx="480" cy="444" r="44" fill="none" stroke="#D85A30" stroke-width="1.5"/>
<circle cx="480" cy="444" r="49" fill="none" stroke="#D85A30" stroke-width="1.5"/>
<circle cx="480" cy="444" r="61" fill="none" stroke="#D85A30" stroke-width="1.5"/>
<circle cx="480" cy="444" r="66" fill="none" stroke="#D85A30" stroke-width="1.5"/>
<circle cx="480" cy="444" r="71" fill="none" stroke="#D85A30" stroke-width="1.5"/>
</svg>
