<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit and spin in three sodium levels</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Orbit and spin in three sodium levels</h1>
<svg width="100%" viewBox="0 0 680 330" role="img"><title>Orbit and spin in three sodium levels</title><desc>Left: ground state with no orbit, only a spinning electron with spin arrow S. Middle: the P one-half level, with an orbit, L pointing up from the nucleus and the electron's spin pointing down, against L. Right: the P three-halves level, with the same orbit and L, and the spin pointing up, along L.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<circle cx="120" cy="160" r="60" fill="none" stroke="var(--t)" stroke-width="0.5" stroke-dasharray="3 3"/>
<circle cx="120" cy="160" r="4" fill="var(--p)"/>
<line x1="155" y1="138" x2="155" y2="92" stroke="#7F77DD" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="155" cy="148" r="10" fill="#7F77DD" fill-opacity="0.3" stroke="#7F77DD" stroke-width="1"/>
<text class="th" x="165" y="100">S</text>
<text class="ts" x="120" y="60" text-anchor="middle">round cloud, no orbit</text>
<ellipse cx="340" cy="170" rx="68" ry="20" fill="none" stroke="#1D9E75" stroke-width="1"/>
<line x1="340" y1="170" x2="340" y2="92" stroke="#1D9E75" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="340" cy="170" r="4" fill="var(--p)"/>
<text class="th" x="350" y="100">L</text>
<line x1="408" y1="180" x2="408" y2="226" stroke="#7F77DD" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="408" cy="170" r="10" fill="#7F77DD" fill-opacity="0.3" stroke="#7F77DD" stroke-width="1"/>
<text class="th" x="418" y="226">S</text>
<text class="ts" x="340" y="60" text-anchor="middle">orbit, spin against L</text>
<ellipse cx="560" cy="170" rx="68" ry="20" fill="none" stroke="#1D9E75" stroke-width="1"/>
<line x1="560" y1="170" x2="560" y2="92" stroke="#1D9E75" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="560" cy="170" r="4" fill="var(--p)"/>
<text class="th" x="570" y="100">L</text>
<line x1="628" y1="160" x2="628" y2="114" stroke="#7F77DD" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="628" cy="170" r="10" fill="#7F77DD" fill-opacity="0.3" stroke="#7F77DD" stroke-width="1"/>
<text class="th" x="638" y="122">S</text>
<text class="ts" x="560" y="60" text-anchor="middle">orbit, spin along L</text>
<text class="th" x="120" y="270" text-anchor="middle">²S1/2, ground state</text>
<text class="ts" x="120" y="290" text-anchor="middle">L = 0, S = ½</text>
<text class="ts" x="120" y="308" text-anchor="middle">J = ½</text>
<text class="th" x="340" y="270" text-anchor="middle">²P1/2</text>
<text class="ts" x="340" y="290" text-anchor="middle">L = 1, S = ½</text>
<text class="ts" x="340" y="308" text-anchor="middle">J = 1 − ½ = ½</text>
<text class="th" x="560" y="270" text-anchor="middle">²P3/2</text>
<text class="ts" x="560" y="290" text-anchor="middle">L = 1, S = ½</text>
<text class="ts" x="560" y="308" text-anchor="middle">J = 1 + ½ = 3/2</text>
</svg>
<p class="note">Recreated from the chat "Zeeman effect and electron precession". Speeds and sizes in animations are scaled for visibility.</p>
</body>
</html>
