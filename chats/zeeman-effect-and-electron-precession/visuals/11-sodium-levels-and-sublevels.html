<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sodium levels without and with a magnetic field</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Sodium levels without and with a magnetic field</h1>
<svg width="100%" viewBox="0 0 680 430" role="img"><title>Sodium energy levels without and with a magnetic field</title><desc>Left, no field: ground level at the bottom, two close upper levels at the top, with the D1 transition at 589.6 nanometres from the lower of the two and the D2 transition at 589.0 nanometres from the higher. Right, weak field: the highest level splits into four sublevels, the next into two closely spaced sublevels, and the ground level into two widely spaced sublevels.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="155" y="30" text-anchor="middle">No field</text>
<text class="th" x="430" y="30" text-anchor="middle">Weak field</text>
<text class="ts" x="160" y="60">²P3/2</text>
<line x1="160" y1="70" x2="250" y2="70" stroke="var(--p)" stroke-width="1.5"/>
<text class="ts" x="60" y="140">²P1/2</text>
<line x1="60" y1="150" x2="150" y2="150" stroke="var(--p)" stroke-width="1.5"/>
<text class="ts" x="60" y="112">2 meV apart</text>
<text class="ts" x="60" y="384">²S1/2, ground state</text>
<line x1="60" y1="360" x2="250" y2="360" stroke="var(--p)" stroke-width="1.5"/>
<line x1="105" y1="154" x2="105" y2="354" stroke="#BA7517" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="205" y1="74" x2="205" y2="354" stroke="#BA7517" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="113" y="280">D1 589.6 nm</text>
<text class="ts" x="213" y="230">D2 589.0 nm</text>
<line class="leader" x1="250" y1="70" x2="340" y2="70"/>
<line class="leader" x1="150" y1="150" x2="340" y2="150"/>
<line class="leader" x1="250" y1="360" x2="340" y2="360"/>
<line x1="340" y1="40" x2="520" y2="40" stroke="var(--p)" stroke-width="1.5"/>
<line x1="340" y1="60" x2="520" y2="60" stroke="var(--p)" stroke-width="1.5"/>
<line x1="340" y1="80" x2="520" y2="80" stroke="var(--p)" stroke-width="1.5"/>
<line x1="340" y1="100" x2="520" y2="100" stroke="var(--p)" stroke-width="1.5"/>
<text class="ts" x="530" y="66">4 sublevels</text>
<text class="ts" x="530" y="84">g = 4/3</text>
<line x1="340" y1="145" x2="520" y2="145" stroke="var(--p)" stroke-width="1.5"/>
<line x1="340" y1="155" x2="520" y2="155" stroke="var(--p)" stroke-width="1.5"/>
<text class="ts" x="530" y="146">2 sublevels</text>
<text class="ts" x="530" y="164">g = 2/3</text>
<line x1="340" y1="345" x2="520" y2="345" stroke="var(--p)" stroke-width="1.5"/>
<line x1="340" y1="375" x2="520" y2="375" stroke="var(--p)" stroke-width="1.5"/>
<text class="ts" x="530" y="356">2 sublevels</text>
<text class="ts" x="530" y="374">g = 2</text>
<text class="ts" x="430" y="250" text-anchor="middle">Sublevel spacing = g × μ_B·B</text>
<text class="ts" x="430" y="410" text-anchor="middle">D1 becomes 4 lines, D2 becomes 6 lines</text>
</svg>
<p class="note">Recreated from the chat "Zeeman effect and electron precession". Speeds and sizes in animations are scaled for visibility.</p>
</body>
</html>
